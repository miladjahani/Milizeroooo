# استقرار Cloudflare Workers
name = "miliconfig-worker"
main = "_worker.js"
compatibility_date = "2024-11-06"

[vars]
BRAND = "miliconfig"

[observability]
enabled = true

# اتصال دائمی D1: با Wrangler 4.45+ دیتابیس به‌صورت خودکار ساخته می‌شود.
# برای نسخه‌های قدیمی‌تر، database_id اکانت خودتان را اینجا اضافه کنید.
[[d1_databases]]
binding = "DB"
database_name = "miliconfig-db"

[triggers]
crons = ["*/15 * * * *"]
