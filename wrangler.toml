# ============================================================================
# miliconfig v3.9 - پیکربندی استاندارد استقرار روی Cloudflare Workers & Pages
# ============================================================================
# ⚠️ نکته بسیار مهم برای جلوگیری از خطای Error 1101:
# هرگز یک database_id ثابت متعلق به اکانت کلودفلر دیگر را در این فایل فعال نگذارید!
# • اگر بدون D1 مستقر کنید، پنل بدون هیچ خطایی در حالت Memory بالا می‌آید.
# • اگر با ابزار cf-deployer مستقر می‌کنید، تیک «ساخت خودکار دیتابیس D1» را بزنید.
# • اگر از داشبورد کلودفلر استفاده می‌کنید، از بخش Settings -> Bindings -> D1 Database
#   دیتابیس خودتان را با نام DB متصل کنید (جداول در اولین درخواست خودکار ساخته می‌شوند).
# ============================================================================

name = "miliconfig-panel"
main = "_worker.js"
compatibility_date = "2024-11-06"

[vars]
BRAND = "miliconfig"

# لاگ‌های اجرا برای عیب‌یابی در داشبورد کلودفلر
[observability]
enabled = true

# برای اتصال از طریق Wrangler CLI، شناسه دیتابیس D1 اکانت خودتان را جایگزین کرده و از حالت کامنت خارج کنید:
# [[d1_databases]]
# binding = "DB"
# database_name = "miliconfig-db"
# database_id = "YOUR_D1_DATABASE_ID_HERE"

# کرون تازه‌سازی استخر پروکسی کشورها
[triggers]
crons = ["*/15 * * * *"]
